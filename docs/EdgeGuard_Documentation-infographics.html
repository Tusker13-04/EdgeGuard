<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EdgeGuard Clear Infographics</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; min-height: 100%; font-family: sans-serif; background: #f4f4f9; }
    .header { text-align: center; padding: 20px 10px 0; color: #222; }
    .header p { margin: 5px 0 0; color: #555; }
    .container { 
      width: 90vw; 
      height: 50vh; 
      margin: 15px auto 40px; 
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      position: relative;
    }
    .export-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 6px 12px;
      background: #00979D;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      z-index: 999;
    }
    .export-btn:hover { background: #007D82; }
  </style>
</head>
<body>
  
  <div class="header">
    <h2>1. What it Does (The 30-Second Pitch)</h2>
  </div>
  <div class="container" id="container-flow">
    <button class="export-btn" id="export-flow">Export SVG</button>
  </div>

  <div class="header">
    <h2>2. Dual-Brain Architecture (The Creativity)</h2>
  </div>
  <div class="container" id="container-arch">
    <button class="export-btn" id="export-arch">Export SVG</button>
  </div>

  <div class="header">
    <h2>3. Quick Setup Guide (How to Recreate)</h2>
  </div>
  <div class="container" id="container-guide">
    <button class="export-btn" id="export-guide">Export SVG</button>
  </div>

  <script src="https://unpkg.com/@antv/infographic@latest/dist/infographic.min.js"></script>
  <script>
    const syntaxFlow = `infographic sequence-ascending-steps
data
  title EdgeGuard Flow
  sequences
    - label 1. Sense
      desc STM32 reads vibration
      icon activity
    - label 2. Analyze
      desc AI finds anomalies
      icon brain
    - label 3. Optimize
      desc Auto low-power mode
      icon leaf
    - label 4. Alert
      desc AWS dashboard sync
      icon cloud upload
  order asc`;

    const syntaxArch = `infographic compare-hierarchy-left-right-circle-node-pill-badge
data
  title Dual-Brain Engine
  compares
    - label STM32 MCU
      icon microchip
      children
        - label Real-time Sensor
          icon activity
        - label Variance Check
          icon filter
    - label Qualcomm Linux
      icon server
      children
        - label Edge Impulse AI
          icon brain
        - label AWS Greengrass
          icon cloud upload`;

    const syntaxGuide = `infographic sequence-snake-steps-simple
data
  title Quick Setup
  sequences
    - label Hardware
      desc Connect sensor
      icon tool
    - label AI Model
      desc Train Edge Impulse
      icon brain
    - label Cloud
      desc Setup AWS Greengrass
      icon cloud
    - label Run
      desc Start App Lab bridge
      icon play
  order asc`;

    function renderInfo(id, syntax, filename) {
      const info = new AntVInfographic.Infographic({ container: '#container-' + id, width: '100%', height: '100%' });
      info.render(syntax);
      document.fonts?.ready.then(() => info.render(syntax));
      document.getElementById('export-' + id).addEventListener('click', async () => {
        const svg = await info.toDataURL({ type: 'svg' });
        const a = document.createElement('a'); a.href = svg; a.download = filename; a.click();
      });
    }

    renderInfo('flow', syntaxFlow, 'EdgeGuard_Flow.svg');
    renderInfo('arch', syntaxArch, 'EdgeGuard_Architecture.svg');
    renderInfo('guide', syntaxGuide, 'EdgeGuard_Setup.svg');
  </script>
</body>
</html>
