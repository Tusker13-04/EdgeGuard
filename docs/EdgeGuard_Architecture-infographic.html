<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EdgeGuard Architecture</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; }
    #container { width: 100vw; height: 100vh; }
    #export-btn { position: fixed; top: 16px; right: 16px; padding: 8px 16px; background: #00979D; color: white; border: none; border-radius: 4px; cursor: pointer; z-index: 999; }
  </style>
</head>
<body>
  <button id="export-btn">Export SVG</button>
  <div id="container"></div>
  <script src="https://unpkg.com/@antv/infographic@latest/dist/infographic.min.js"></script>
  <script>
    const syntax = `infographic compare-hierarchy-left-right-circle-node-pill-badge
data
  title Hardware Architecture
  desc Concurrent execution via Dual-Brain topology
  compares
    - label STM32 (Cortex-M33)
      icon microchip
      children
        - label Vibration & Temp Sensors
          icon activity
        - label Idle Variance Check
          icon filter
    - label Qualcomm (Cortex-A53)
      icon server
      children
        - label ONNX ML Inference
          icon brain
        - label AWS Greengrass Core
          icon cloud upload`;
    const info = new AntVInfographic.Infographic({ container: '#container', width: '100%', height: '100%' });
    info.render(syntax);
    document.fonts?.ready.then(() => info.render(syntax));
    document.getElementById('export-btn').addEventListener('click', async () => {
      const svg = await info.toDataURL({ type: 'svg' });
      const a = document.createElement('a'); a.href = svg; a.download = 'EdgeGuard_Architecture.svg'; a.click();
    });
  </script>
</body>
</html>
