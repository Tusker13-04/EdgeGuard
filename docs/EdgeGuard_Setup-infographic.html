<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EdgeGuard Setup Guide</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; }
    #container { width: 100vw; height: 100vh; }
    #export-btn { position: fixed; top: 16px; right: 16px; padding: 8px 16px; background: #00979D; color: white; border: none; border-radius: 4px; cursor: pointer; z-index: 999; }
  </style>
</head>
<body>
  <button id="export-btn">Export SVG</button>
  <div id="container"></div>
  <script src="https://unpkg.com/@antv/infographic@latest/dist/infographic.min.js"></script>
  <script>
    const syntax = `infographic sequence-stairs-front-compact-card
data
  title Deployment Pipeline
  sequences
    - label 1. Sensor Integration
      desc Wire Vibration & Temperature sensors to UNO Q
      icon tool
    - label 2. ML Deployment
      desc Export and load trained ONNX model
      icon brain
    - label 3. Edge Runtime
      desc Provision AWS Greengrass Core v2
      icon cloud
    - label 4. IPC Socket Init
      desc Run bridge_receiver.py & engine.py
      icon code
  order asc
theme
  palette #00979D #E47128 #F1B221 #454955`;
    const info = new AntVInfographic.Infographic({ container: '#container', width: '100%', height: '100%' });
    info.render(syntax);
    document.fonts?.ready.then(() => info.render(syntax));
    document.getElementById('export-btn').addEventListener('click', async () => {
      const svg = await info.toDataURL({ type: 'svg' });
      const a = document.createElement('a'); a.href = svg; a.download = 'EdgeGuard_Setup.svg'; a.click();
    });
  </script>
</body>
</html>
