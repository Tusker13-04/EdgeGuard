<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EdgeGuard Dashboard</title>
  <style>
    :root {
      --color-bg:      #0e1117;
      --color-surface: #161b22;
      --color-border:  #30363d;
      --color-text:    #e6edf3;
      --color-muted:   #8b949e;
      --color-accent:  #58a6ff;
      --color-warn:    #d29922;
      --color-error:   #f85149;
      --color-ok:      #3fb950;
      --font:          'Inter', system-ui, sans-serif;
      --radius:        8px;
      --transition:    180ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 24px;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-surface);
    }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1.05rem; }
    .status-pill {
      font-size: 0.75rem; padding: 3px 10px;
      border-radius: 999px;
      background: color-mix(in oklab, var(--color-ok) 15%, transparent);
      color: var(--color-ok);
      border: 1px solid color-mix(in oklab, var(--color-ok) 40%, transparent);
    }
    main {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px; padding: 24px; align-content: start;
    }
    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 20px;
    }
    .card-title {
      font-size: 0.75rem; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--color-muted); margin-bottom: 12px;
    }
    .big-val { font-size: 2.2rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
    .sub-val  { font-size: 0.85rem; color: var(--color-muted); margin-top: 6px; }
    .diag-card { grid-column: span 2; }
    @media (max-width: 700px) { .diag-card { grid-column: span 1; } }
    .diag-label {
      font-size: 1.15rem; font-weight: 600;
      padding: 8px 14px; border-radius: var(--radius);
      background: var(--color-bg); border: 1px solid var(--color-border);
      transition: background var(--transition), color var(--transition), border-color var(--transition);
    }
    .diag-label.warn  { background: color-mix(in oklab, var(--color-warn)  15%, transparent); color: var(--color-warn);  border-color: color-mix(in oklab, var(--color-warn)  40%, transparent); }
    .diag-label.error { background: color-mix(in oklab, var(--color-error) 15%, transparent); color: var(--color-error); border-color: color-mix(in oklab, var(--color-error) 40%, transparent); }
    .diag-label.ok    { background: color-mix(in oklab, var(--color-ok)    15%, transparent); color: var(--color-ok);    border-color: color-mix(in oklab, var(--color-ok)    40%, transparent); }

    /* Fault overlay — shown ONLY when imbalance_prob > 0.8 */
    .fault-overlay {
      display: none; position: fixed; inset: 0;
      background: color-mix(in oklab, var(--color-error) 12%, var(--color-bg));
      border: 2px solid var(--color-error); z-index: 100;
      align-items: center; justify-content: center; flex-direction: column; gap: 16px;
      animation: pulse-border 1.4s ease-in-out infinite;
    }
    body[data-fault="true"] .fault-overlay { display: flex; }
    .fault-overlay h2 { font-size: 1.8rem; color: var(--color-error); }
    .fault-overlay p  { color: var(--color-muted); text-align: center; max-width: 36ch; }
    .fault-overlay button {
      margin-top: 8px; padding: 10px 24px;
      border-radius: var(--radius); border: 1px solid var(--color-error);
      background: transparent; color: var(--color-error);
      cursor: pointer; font-size: 0.9rem;
      transition: background var(--transition);
    }
    .fault-overlay button:hover { background: color-mix(in oklab, var(--color-error) 15%, transparent); }
    @keyframes pulse-border {
      0%, 100% { border-color: var(--color-error); }
      50%       { border-color: transparent; }
    }
    .prob-bar-track { height: 6px; border-radius: 3px; background: var(--color-border); overflow: hidden; margin-top: 10px; }
    .prob-bar-fill  {
      height: 100%; border-radius: 3px; background: var(--color-accent);
      transition: width 600ms cubic-bezier(0.16, 1, 0.3, 1), background 400ms ease; width: 0%;
    }
    .prob-bar-fill.warn  { background: var(--color-warn); }
    .prob-bar-fill.error { background: var(--color-error); }
    .tune-badge {
      display: none; font-size: 0.7rem; padding: 2px 8px; border-radius: 999px;
      background: color-mix(in oklab, var(--color-accent) 15%, transparent);
      color: var(--color-accent);
      border: 1px solid color-mix(in oklab, var(--color-accent) 30%, transparent);
      margin-left: 8px;
    }
    .tune-badge.visible { display: inline; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="fault-overlay" role="alertdialog" aria-modal="true" aria-labelledby="fault-title">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--color-error)">
      <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
    <h2 id="fault-title">Fault Detected</h2>
    <p id="fault-diag">High imbalance probability detected.</p>
    <button onclick="document.body.removeAttribute('data-fault')">Acknowledge</button>
  </div>

  <header>
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-label="EdgeGuard logo">
        <rect x="2" y="2" width="24" height="24" rx="6" fill="#58a6ff" opacity=".15"/>
        <path d="M6 14 L12 8 L18 14 L12 20 Z" stroke="#58a6ff" stroke-width="1.8" fill="none"/>
        <circle cx="14" cy="14" r="2" fill="#58a6ff"/>
        <path d="M20 10 L22 8 M20 18 L22 20" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      EdgeGuard
    </div>
    <span class="status-pill" id="conn-status">Connecting...</span>
  </header>

  <main>
    <div class="card diag-card">
      <div class="card-title">Diagnostic
        <span class="tune-badge" id="tune-badge">⚡ Remote-tuned</span>
      </div>
      <div class="diag-label ok" id="diag-label">Nominal Operation</div>
      <div class="sub-val" id="diag-sub">Waiting for first batch...</div>
    </div>
    <div class="card">
      <div class="card-title">Imbalance Probability</div>
      <div class="big-val" id="prob-val">—</div>
      <div class="prob-bar-track"><div class="prob-bar-fill" id="prob-bar"></div></div>
      <div class="sub-val" id="prob-sub">—</div>
    </div>
    <div class="card">
      <div class="card-title">Board Temperature</div>
      <div class="big-val" id="temp-val">—</div>
      <div class="sub-val" id="temp-sub">—</div>
    </div>
    <div class="card">
      <div class="card-title">Model Confidence</div>
      <div class="big-val" id="conf-val">—</div>
      <div class="sub-val" id="conf-sub">Last inference</div>
    </div>
    <div class="card">
      <div class="card-title">Trigger Source</div>
      <div class="big-val" style="font-size:1.1rem;" id="src-val">—</div>
      <div class="sub-val" id="src-sub">anomaly_trigger or sensor_batch</div>
    </div>
  </main>

  <script>
    const FAULT_GATE = 0.80;  // Phase 3 fix: real hardware event gate
    const WS_URL    = `ws://${location.host}/ws`;
    let ws, reconnectTimer;

    function connect() {
      ws = new WebSocket(WS_URL);
      ws.onopen = () => {
        document.getElementById('conn-status').textContent = 'Live';
        document.getElementById('conn-status').style.color = 'var(--color-ok)';
        clearTimeout(reconnectTimer);
      };
      ws.onmessage = ({ data }) => {
        try { handleTelemetry(JSON.parse(data)); } catch (e) { console.warn('Bad WS payload', e); }
      };
      ws.onclose = () => {
        document.getElementById('conn-status').textContent = 'Reconnecting...';
        document.getElementById('conn-status').style.color = 'var(--color-warn)';
        reconnectTimer = setTimeout(connect, 3000);
      };
    }

    function handleTelemetry(t) {
      const prob = t.imbalance_prob ?? 0;
      const temp = t.board_temp_c  ?? null;
      const conf = t.confidence    ?? 0;
      const diag = t.diagnostic    || t.label || '—';
      const src  = t.source        || '—';

      document.getElementById('prob-val').textContent = (prob * 100).toFixed(1) + '%';
      const bar = document.getElementById('prob-bar');
      bar.style.width = (prob * 100) + '%';
      bar.className = 'prob-bar-fill' + (prob > 0.8 ? ' error' : prob > 0.6 ? ' warn' : '');
      document.getElementById('prob-sub').textContent = `Label: ${t.label ?? '—'}`;

      const diagEl = document.getElementById('diag-label');
      diagEl.textContent = diag;
      diagEl.className   = 'diag-label ' + (prob > 0.8 ? 'error' : prob > 0.6 ? 'warn' : 'ok');
      document.getElementById('diag-sub').textContent =
        `Temp state: ${t.temp_state ?? '—'}  ·  Confidence: ${(conf * 100).toFixed(1)}%`;

      if (temp !== null) {
        document.getElementById('temp-val').textContent = temp.toFixed(1) + ' °C';
        document.getElementById('temp-sub').textContent = temp >= 55 ? '⚠ Rising — check cooling' : 'Normal range';
      }
      document.getElementById('conf-val').textContent = (conf * 100).toFixed(1) + '%';
      document.getElementById('src-val').textContent  = src;

      if (t._remote_tuned) document.getElementById('tune-badge').classList.add('visible');

      // Phase 3 fix: fault overlay gated on real telemetry
      if (prob > FAULT_GATE) {
        document.getElementById('fault-diag').textContent = diag;
        document.body.setAttribute('data-fault', 'true');
      }
    }

    connect();
  </script>
</body>
</html>
