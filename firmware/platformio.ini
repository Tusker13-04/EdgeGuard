# EdgeGuard firmware build targets
# Target hardware: Arduino UNO Q (Qualcomm QRB2210 MPU + STM32U585 MCU)

# ─── Arduino UNO Q (STM32U585) ──────────────────────────────────────────────
# Board JSON:
#   https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json
# Board manager ID: STM32U585AI-UNO
# Use nucleo_u575zi_q as fallback if STM32U585AI-UNO is not yet published.
[env:uno_q]
platform  = ststm32
board     = nucleo_u575zi_q
framework = arduino
src_dir   = firmware/uno_q_main

lib_deps =
    stm32duino/STM32duino LIS3DH @ ^2.0.0
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    ; Arduino_RouterBridge — install manually until published on PlatformIO registry:
    ; https://github.com/arduino/ArduinoCore-mbed/tree/main/libraries/Arduino_RouterBridge

build_flags =
    -D F_CPU=160000000L
    -O2
    -std=gnu++17
    -D ARDUINO_ARCH_STM32

monitor_speed = 115200
