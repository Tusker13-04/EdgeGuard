[env:nodemcuv2]
platform  = espressif8266
board     = nodemcuv2
framework = arduino

lib_deps =
    adafruit/Adafruit LIS3DH @ ^1.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0

build_flags =
    -D F_CPU=80000000L
    -O2

monitor_speed = 115200
